<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The walk down — The Guánica Compound</title>
<meta name="description" content="A first-person walk from the terrace, through the house, down the gallery, to the buried club.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--abyss); }
  body {
    font-family: var(--body);
    color: var(--bone);
    -webkit-font-smoothing: antialiased;
  }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; }

  .skip { position: absolute; left: -9999px; }
  .skip:focus {
    left: 0.5rem; top: 0.5rem; z-index: 30; background: var(--shelf);
    color: var(--bone); padding: 0.7rem 1.1rem; font-family: var(--tech);
  }

  /* --- the caption panel -------------------------------------------------- */
  #hud {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 1rem clamp(1rem, 4vw, 2rem) calc(1rem + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(6, 16, 20, 0.92) 0%, rgba(6, 16, 20, 0.72) 45%, rgba(6, 16, 20, 0) 100%);
    pointer-events: none;
    z-index: 10;
  }
  body.is-under #hud {
    background: linear-gradient(to top, rgba(18, 12, 7, 0.92) 0%, rgba(18, 12, 7, 0.72) 45%, rgba(18, 12, 7, 0) 100%);
  }
  #hud-inner { max-width: 46rem; }
  #hud-label {
    font-family: var(--display);
    font-size: clamp(1.3rem, 4vw, 1.9rem);
    font-weight: 460;
    line-height: 1.1;
    margin: 0 0 0.4rem;
    color: var(--bone);
  }
  body.is-under #hud-label { color: #f0dcb8; }
  #hud-text {
    margin: 0;
    font-size: clamp(0.88rem, 2.6vw, 1rem);
    line-height: 1.55;
    color: #b9c2bd;
    max-width: 54ch;
  }
  body.is-under #hud-text { color: #c4b193; }
  #hud-datum {
    font-family: var(--tech);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--scrub);
    margin: 0.7rem 0 0;
  }

  /* --- top bar ------------------------------------------------------------ */
  #bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    padding: calc(0.6rem + env(safe-area-inset-top)) clamp(0.7rem, 3vw, 1.4rem) 0.6rem;
    z-index: 12;
  }
  #bar a.home {
    font-family: var(--tech);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--reef);
    text-decoration: none;
    padding: 0.45rem 0.7rem;
    border: 1px solid var(--rule);
    background: rgba(6, 16, 20, 0.72);
  }
  #bar a.home:hover { color: var(--bone); border-color: var(--reef); }
  .spacer { flex: 1; }
  button, select {
    font-family: var(--tech);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--bone);
    background: rgba(6, 16, 20, 0.72);
    border: 1px solid var(--rule);
    padding: 0.45rem 0.7rem;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--reef); }
  :focus-visible { outline: 2px solid var(--reef); outline-offset: 2px; }

  /* --- the bookcase prompt ------------------------------------------------ */
  #hud-prompt {
    position: fixed;
    inset: auto 0 38% 0;
    text-align: center;
    z-index: 14;
  }
  #hud-prompt button {
    font-size: 0.8rem;
    padding: 0.8rem 1.3rem;
    background: rgba(20, 14, 8, 0.9);
    border-color: var(--lamp);
    color: #f0dcb8;
  }

  /* --- the stick ---------------------------------------------------------- */
  #stick {
    position: fixed;
    left: calc(1rem + env(safe-area-inset-left));
    bottom: calc(9.5rem + env(safe-area-inset-bottom));
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: rgba(6, 16, 20, 0.5);
    touch-action: none;
    z-index: 15;
    display: none;
  }
  body.is-free #stick { display: block; }
  #knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 40px; height: 40px;
    margin: -20px 0 0 -20px;
    border-radius: 50%;
    background: rgba(79, 179, 168, 0.5);
    pointer-events: none;
  }
  @media (hover: hover) and (pointer: fine) {
    body.is-free #stick { display: none; }
  }

  #hint {
    position: fixed;
    right: clamp(0.7rem, 3vw, 1.4rem);
    bottom: calc(9.5rem + env(safe-area-inset-bottom));
    font-family: var(--tech);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    color: var(--scrub);
    text-align: right;
    z-index: 12;
    display: none;
    pointer-events: none;
  }
  body.is-free #hint { display: block; }

  #loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    padding: 2rem;
    font-family: var(--tech);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: var(--scrub);
    background: var(--abyss);
    z-index: 20;
  }
  /* display:grid would otherwise beat the [hidden] attribute */
  #loading[hidden] { display: none; }
</style>
</head>
<body>
<a class="skip" href="#hud-text">Skip to the current caption</a>

<canvas id="scene"></canvas>

<div id="bar">
  <a class="home" href="index.html">← The document</a>
  <span class="spacer"></span>
  <button id="btn-free" type="button">Free walk</button>
  <button id="btn-restart" type="button">Restart tour</button>
  <select id="quality" aria-label="Rendering quality">
    <option value="auto">Auto</option>
    <option value="low">Low</option>
    <option value="high">High</option>
  </select>
</div>

<div id="hud-prompt" hidden>
  <button id="btn-gate" type="button">Pull the book · open the bookcase</button>
</div>

<div id="hud">
  <div id="hud-inner">
    <h1 id="hud-label">The terrace</h1>
    <p id="hud-text"></p>
    <p id="hud-datum"></p>
  </div>
</div>

<div id="stick"><div id="knob"></div></div>
<p id="hint">Drag to look · stick to move<br>WASD + drag on desktop, shift to run</p>

<div id="loading">Building the headland from survey data…</div>

<script type="module" src="assets/js/walkthrough.js"></script>
</body>
</html>
